services:
  ollama:
    image: ollama/ollama:latest
    container_name: langgraph_ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langgraph_network
    restart: on-failure:3

  ollama-pull:
    image: ollama/ollama:latest
    container_name: langgraph_ollama_pull
    entrypoint: ["/bin/sh", "-c", "for m in ${OLLAMA_PULL_MODELS:-qwen2.5:7b-instruct nomic-embed-text}; do ollama pull \"$$m\"; done"]
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - langgraph_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: langgraph_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DATABASE:-langgraph_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langgraph_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langgraph_backend
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-ollama}
      - MODEL_NAMES=${MODEL_NAMES:-["qwen2.5:7b-instruct"]}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://ollama:11434}
      - EMBEDDINGS_MODEL_NAME=${EMBEDDINGS_MODEL_NAME:-nomic-embed-text}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL:-http://ollama:11434}
      - TOKEN_BEARER_URL=${TOKEN_BEARER_URL:-/api/v1/auth/login}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRY_MINS=${ACCESS_TOKEN_EXPIRY_MINS:-15}
      - REFRESH_TOKEN_EXPIRY_DAYS=${REFRESH_TOKEN_EXPIRY_DAYS:-30}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-rag_refresh}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-["http://localhost"]}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-langgraph_db}
      - PGVECTOR_COLLECTION_NAME=${PGVECTOR_COLLECTION_NAME:-my_collection}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    networks:
      - langgraph_network
    restart: on-failure:3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: langgraph_frontend
    environment:
      - BACKEND_BASE_URL=http://backend:8000/api/v1
      # REMOVED: ${BACKEND_BASE_URL:-http://backend:8000/api/v1}
      - MODEL_NAMES=${MODEL_NAMES:-["qwen2.5:7b-instruct"]}
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - langgraph_network
    restart: on-failure:3

  nginx:
    image: nginx:1.27-alpine
    container_name: langgraph_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - langgraph_network
    restart: on-failure:3

volumes:
  postgres_data:
  ollama_data:

networks:
  langgraph_network:
    driver: bridge